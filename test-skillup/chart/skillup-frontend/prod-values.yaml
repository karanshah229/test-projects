global:
  environment: production
  image: 
    repository: 134148934511.dkr.ecr.us-east-1.amazonaws.com/skillup-frontend
  dnsConfig:
    searches: ['vpc.hackerrank.com']


skillup-frontend:
  replicaCount: 3
  argoRollouts:
    enabled: true
  envVariables:
    NEXT_PUBLIC_CDN_URL: "hrcdn.net"
    NEW_RELIC_APP_NAME: "skillup-frontend-production"
    NEW_RELIC_ENABLED: "true"
    BACKEND_URL:  "https://appgateway.hackerrank.com"
  ingress:
    public:
      nameSuffix: public
      enabled: true
      className: ""
      annotations:
        alb.ingress.kubernetes.io/certificate-arn: >-
          arn:aws:acm:us-east-1:134148934511:certificate/c3bf2efd-c7ec-4918-b405-5a63a0e5610b
        alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
        alb.ingress.kubernetes.io/healthcheck-path: /jobs-workflow/healthcheck
        alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
        alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '10'
        alb.ingress.kubernetes.io/healthy-threshold-count: '4'
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
        alb.ingress.kubernetes.io/load-balancer-attributes: >-
          access_logs.s3.enabled=true,access_logs.s3.bucket=hackerrank-access-logs,access_logs.s3.prefix=skillup-frontend-prod-alb,deletion_protection.enabled=true
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/security-groups: sg-07995bc67fb64348a
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
        alb.ingress.kubernetes.io/subnets: >-
          subnet-0c47a76cb1c9d2234, subnet-06b4c340c1b51bfdc,
          subnet-081c170b7158f8aa5
        alb.ingress.kubernetes.io/tags: Environment=production,Name=skillup-frontend-alb
        alb.ingress.kubernetes.io/target-group-attributes: slow_start.duration_seconds=180,deregistration_delay.timeout_seconds=120
        alb.ingress.kubernetes.io/target-type: instance
        alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
        kubernetes.io/ingress.class: public-alb
        kubernetes.io/external-dns: create
        external-dns.alpha.kubernetes.io/hostname: skillup.hackerrank.com
      hosts:
        - host: "*.hackerrank.com"
          paths:
            - path: "/*"
              pathType: ImplementationSpecific
  podAnnotations:
    observability.hackerrank.com/logging: 'enabled'
    observability.hackerrank.com/newrelic-logging: 'enabled'

