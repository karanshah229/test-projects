{{- if .Values.servicemonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    {{- include "starter.labels" . | nindent 4 }}
    release: prometheus-operator
  name: {{ include "starter.fullname" . }}-service-monitor
  namespace: {{ $.Release.Namespace }}
spec:
  endpoints:
  - path: {{ .Values.servicemonitor.metricsPath }}
    {{- if ne .Values.servicemonitor.targetPort "http" }}
    targetPort: metrics
    {{- else }}
    targetPort: http
    {{- end }}
    interval: 60s
    scrapeTimeout: 30s
  jobLabel: {{ include "starter.fullname" . }}
  namespaceSelector:
    matchNames:
    - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      {{- include "starter.selectorLabels" . | nindent 6 }}
---
{{- end }}